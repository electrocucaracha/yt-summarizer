<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="720" viewBox="0 0 1024 720" role="img" aria-labelledby="title desc">
  <title id="title">Processing pipeline</title>
  <desc id="desc">Sequence diagram showing the user, CLI, summarizer service, Notion, YouTube, and LLM client interactions in the processing pipeline.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3b3b3b"/>
    </marker>
    <style>
      .box { fill: #f5f5f5; stroke: #666; stroke-width: 2; rx: 12; ry: 12; }
      .service { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 2; }
      .storage { fill: #d5e8d4; stroke: #82b366; stroke-width: 2; }
      .highlight { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; }
      .summary { fill: #e1d5e7; stroke: #9673a6; stroke-width: 2; }
      .label { font: 16px Arial, sans-serif; fill: #1f1f1f; }
      .tiny { font: 13px Arial, sans-serif; fill: #333; }
      .line { stroke: #3b3b3b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1024" height="720" fill="#ffffff"/>

  <rect class="service" x="60" y="230" width="120" height="60"/>
  <text class="label" x="120" y="267" text-anchor="middle">User</text>

  <rect class="service" x="240" y="230" width="120" height="60"/>
  <text class="label" x="300" y="267" text-anchor="middle">CLI</text>

  <rect class="service" x="430" y="230" width="170" height="60"/>
  <text class="label" x="515" y="267" text-anchor="middle">Summarizer</text>
  <text class="label" x="515" y="287" text-anchor="middle">Service</text>

  <rect class="storage" x="680" y="120" width="170" height="60"/>
  <text class="label" x="765" y="157" text-anchor="middle">Notion</text>
  <text class="label" x="765" y="177" text-anchor="middle">Client</text>

  <rect class="box" x="680" y="230" width="170" height="60"/>
  <text class="label" x="765" y="267" text-anchor="middle">YouTube</text>
  <text class="label" x="765" y="287" text-anchor="middle">Client</text>

  <rect class="box" x="680" y="340" width="170" height="60"/>
  <text class="label" x="765" y="377" text-anchor="middle">LLM</text>
  <text class="label" x="765" y="397" text-anchor="middle">Client</text>

  <polygon class="highlight" points="430,430 610,430 660,465 610,500 430,500 380,465"/>
  <text class="label" x="520" y="472" text-anchor="middle">For each video</text>

  <rect class="summary" x="360" y="570" width="260" height="70"/>
  <text class="label" x="490" y="606" text-anchor="middle">Generate collection-level</text>
  <text class="label" x="490" y="626" text-anchor="middle">summary</text>

  <path class="line" d="M180 260 L240 260"/>
  <text class="tiny" x="210" y="248" text-anchor="middle">Execute with options</text>

  <path class="line" d="M360 260 L430 260"/>
  <text class="tiny" x="395" y="248" text-anchor="middle">Initialize configured</text>
  <text class="tiny" x="395" y="264" text-anchor="middle">clients</text>

  <path class="line" d="M600 250 L680 150"/>
  <text class="tiny" x="640" y="200" text-anchor="middle">Query records</text>

  <path class="line dashed" d="M680 180 L600 230"/>
  <text class="tiny" x="640" y="214" text-anchor="middle">Return metadata</text>

  <path class="line" d="M600 260 L680 260"/>
  <text class="tiny" x="640" y="248" text-anchor="middle">Fetch title + transcript</text>

  <path class="line dashed" d="M680 290 L600 290"/>
  <text class="tiny" x="640" y="310" text-anchor="middle">Return transcript</text>

  <path class="line" d="M600 290 L700 340"/>
  <text class="tiny" x="665" y="330" text-anchor="middle">Generate summary</text>

  <path class="line dashed" d="M700 340 L600 320"/>
  <text class="tiny" x="660" y="340" text-anchor="middle">Return summary</text>

  <path class="line" d="M600 310 L700 360"/>
  <text class="tiny" x="654" y="365" text-anchor="middle">Extract main points</text>

  <path class="line" d="M600 280 L680 170"/>
  <text class="tiny" x="640" y="150" text-anchor="middle">Update database</text>

  <path class="line dashed" d="M680 150 L600 245"/>
  <text class="tiny" x="640" y="135" text-anchor="middle">Confirm update</text>

  <path class="line" d="M600 290 L500 570"/>
  <text class="tiny" x="560" y="540" text-anchor="middle">Return executive summary</text>

  <path class="line" d="M360 290 L120 290"/>
  <text class="tiny" x="240" y="308" text-anchor="middle">Print executive summary</text>
</svg>
