default_install_hook_types:
  - pre-commit
  - prepare-commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        files: \.(md|mdown|markdown)$
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: local
    hooks:
      - id: python-style
        name: Check Python style
        entry: uvx tox -e lint-check
        language: system
        files: \.py$|^pyproject\.toml$
        pass_filenames: false
      - id: pylint
        name: Check Python lint
        entry: uv run --extra test --with pylint pylint src/ tests/
        language: system
        files: \.py$|^pyproject\.toml$
        pass_filenames: false
      - id: lint-duplicates
        name: Check for duplicated code
        entry: make lint-duplicates
        language: system
        pass_filenames: false
  - repo: https://github.com/electrocucaracha/ai-prepare-commit-msg
    rev: v20.14.1
    hooks:
      - id: ai-prepare-commit
        stages:
          - prepare-commit-msg
