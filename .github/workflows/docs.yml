name: Verify Documentation
# yamllint disable-line rule:truthy
on:
  push:
    paths:
      - "**.md"
  pull_request:
permissions:
  contents: read
jobs:
  check-broken-links:
    name: Check documentation external links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Check broken links
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # 1.1.3
  check-instructions:
    runs-on: ubuntu-latest
    name: Check documentation instructions
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # 10.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version: "^1.27"
      - name: Install runme CLI
        run: go install github.com/runmedev/runme/v3@latest
      - name: Check Development environment setup
        run: ~/go/bin/runme run contributing.install contributing.verify
      - name: Check Development process
        run: ~/go/bin/runme run --parallel contributing.test contributing.fmt
